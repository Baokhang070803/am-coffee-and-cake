<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách hội thoại - Ấm Messenger</title>
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <style>
    body { background: #f5f6fa; margin: 0; font-family: 'Roboto', Arial, sans-serif; }
    .mobile-header { background: #fff; padding: 12px 14px; box-sizing: border-box; width: 100%; max-width: none; margin: 0; border-radius: 0; display: flex; align-items: center; gap: 10px; }
    .back-home-btn { background: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.10); display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none; transition: box-shadow 0.18s; padding: 0; }
    .back-home-btn i { font-size: 22px; color: #a67c52; }
    #mobileSearchInput { width: 100%; min-width: 0; box-sizing: border-box; padding: 12px 16px; border-radius: 22px; border: 1.5px solid #e4e6ea; font-size: 17px; background: #f7f7f7; color: #222; outline: none; transition: box-shadow 0.18s, background 0.18s; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    #mobileSearchInput:focus { background: #fff; color: #222; box-shadow: 0 2px 12px rgba(0,0,0,0.10); border-color: #a67c52; }
    .mobile-conversation-list {
      background: #fff;
      padding-bottom: 16px;
      box-sizing: border-box;
      width: 100%;
      max-width: none;
      margin: 0;
      border-radius: 0;
    }
    .mobile-conversation-item { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.13s, box-shadow 0.13s; border-radius: 14px; margin: 10px 0; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.03); }
    .mobile-conversation-item:hover, .mobile-conversation-item:focus { background: #f5f6fa; color: #222; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
    .mobile-avatar { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; background: #e0e0e0; display: flex; align-items: center; justify-content: center; border: 2.5px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .mobile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .mobile-conv-info { flex: 1; min-width: 0; }
    .mobile-conv-name { font-weight: 700; color: #222; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.2px; }
    .mobile-conv-last { color: #888; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .mobile-conv-time { font-size: 13px; color: #bbb; margin-left: 8px; white-space: nowrap; }
    @media (min-width: 900px) {
      body { background: #f5f6fa; }
      .mobile-header { max-width: 100vw; margin: 0; border-radius: 0; }
      .mobile-conversation-list {
        max-width: 100vw;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        border: none;
        background: #fff;
        padding: 32px 0 32px 0;
      }
      .mobile-conversation-item {
        font-size: 22px;
        border-radius: 0;
        margin: 0;
        padding: 28px 48px;
        background: #fff;
        box-shadow: none;
      }
      .mobile-conversation-item:hover, .mobile-conversation-item:focus {
        background: #f0f2f5;
        color: #222;
        box-shadow: none;
      }
      #mobileSearchInput { font-size: 22px; padding: 22px 32px; }
      .mobile-avatar { width: 80px; height: 80px; }
      .mobile-conv-name { font-size: 28px; }
      .mobile-conv-last { font-size: 20px; }
      .mobile-conv-time { font-size: 18px; }
    }
    @media (max-width: 600px) {
      .mobile-conversation-list { max-width: 100vw; border-radius: 0; box-shadow: none; }
      .mobile-header { border-radius: 0; }
    }
  </style>
</head>
<body>
  
  <div class="mobile-header">
    <button class="back-home-btn" id="backHomeBtn"><i class="fa fa-home"></i></button>
    <input type="text" id="mobileSearchInput" placeholder="Tìm kiếm bạn bè..." />
  </div>
  <div class="mobile-conversation-list" id="mobileConversationList"></div>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
    const firebaseConfig = { /* ... dùng config cũ ... */
      apiKey: "AIzaSyA5NhPnsfXEUbXYzkdB5kvfaE0swtViJaI",
      authDomain: "coffee-and-cake-e2f5d.firebaseapp.com",
      databaseURL: "https://coffee-and-cake-e2f5d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "coffee-and-cake-e2f5d",
      storageBucket: "coffee-and-cake-e2f5d.appspot.com",
      messagingSenderId: "453243002159",
      appId: "1:453243002159:web:074baa5652ed789ecbd5da",
      measurementId: "G-1H7DM8MQCV"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    let currentUser = null;
    let friendsList = [];
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) loadFriendsList();
    });
    async function loadFriendsList() {
      if (!currentUser) return;
      const db = getDatabase();
      const userSnap = await get(ref(db, 'users/' + currentUser.uid + '/friends'));
      const friends = userSnap.exists() ? Object.keys(userSnap.val() || {}) : [];
      let list = [];
      for (const fid of friends) {
        let name = '', avatar = 'images/default-avatar.png', email = '';
        const friendSnap = await get(ref(db, 'users/' + fid));
        if (friendSnap.exists()) {
          const f = friendSnap.val();
          name = f.name || f.displayName || f.email || 'Người dùng';
          avatar = f.avatarUrl || 'images/default-avatar.png';
          email = f.email || '';
        }
        // Lấy lastMessage, updatedAt
        const convId = [currentUser.uid, fid].sort().join('_');
        const metaSnap = await get(ref(db, 'conversationMeta/' + convId));
        let lastMessage = '', updatedAt = 0;
        if (metaSnap.exists()) {
          const meta = metaSnap.val();
          lastMessage = meta.lastMessage || '';
          updatedAt = meta.updatedAt || 0;
        }
        list.push({ uid: fid, name, avatar, email, lastMessage, updatedAt });
      }
      // Sắp xếp theo updatedAt mới nhất
      list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      friendsList = list;
      renderMobileConversationList(list);
    }
    function renderMobileConversationList(list) {
      const convDiv = document.getElementById('mobileConversationList');
      if (!convDiv) return;
      if (list.length === 0) {
        convDiv.innerHTML = '<div style="color:#aaa;text-align:center;margin-top:30px;">Bạn chưa có bạn bè nào.</div>';
        return;
      }
      convDiv.innerHTML = list.map(f => `
        <div class="mobile-conversation-item" data-uid="${f.uid}">
          <div class="mobile-avatar">${f.avatar ? `<img src='${f.avatar}'>` : f.name.charAt(0).toUpperCase()}</div>
          <div class="mobile-conv-info">
            <div class="mobile-conv-name">${f.name}</div>
            <div class="mobile-conv-last">${f.lastMessage || '<span style=\'color:#555\'>Chưa có tin nhắn</span>'}</div>
          </div>
          <div class="mobile-conv-time">${f.updatedAt ? formatTimeAgo(f.updatedAt) : ''}</div>
        </div>
      `).join('');
      convDiv.querySelectorAll('.mobile-conversation-item').forEach(item => {
        item.onclick = () => {
          const uid = item.getAttribute('data-uid');
          window.location.href = `MessengerChat.html?uid=${encodeURIComponent(uid)}`;
        };
      });
    }
    function formatTimeAgo(ts) {
      if (!ts) return '';
      const now = Date.now();
      const diff = now - ts;
      const min = 60*1000, hour = 60*min, day = 24*hour;
      if (diff < min) return 'Vừa xong';
      if (diff < hour) return Math.floor(diff/min) + 'ph';
      if (diff < day) return Math.floor(diff/hour) + 'g';
      return new Date(ts).toLocaleDateString('vi-VN');
    }
    document.getElementById('mobileSearchInput').addEventListener('input', function() {
      const q = this.value.trim().toLowerCase();
      let filtered = friendsList;
      if (q) {
        filtered = friendsList.filter(f => f.name.toLowerCase().includes(q) || (f.lastMessage||'').toLowerCase().includes(q));
      }
      renderMobileConversationList(filtered);
    });
    // Nút quay về trang chủ
    document.getElementById('backHomeBtn').onclick = function() {
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
