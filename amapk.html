<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Ấm Coffee & Cake App</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(120deg, #d72638 0%, #fbb040 100%);
            overflow-x: hidden;
            position: relative;
            animation: bgfadein 1.2s cubic-bezier(.77,0,.18,1) 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes bgfadein {
            from { filter: blur(16px) brightness(0.7); opacity: 0; }
            to   { filter: blur(0) brightness(1); opacity: 1; }
        }
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            background: rgba(255,255,255,0.95);
            border-radius: 28px;
            box-shadow: 0 8px 40px 0 rgba(215,38,56,0.13), 0 1.5px 8px rgba(0,0,0,0.06);
            padding: 32px 16px 28px 16px;
            max-width: 370px;
            width: 96vw;
            text-align: center;
            margin: 0;
            animation: fadeinup 1.2s cubic-bezier(.77,0,.18,1) 0.2s both;
        }
        @keyframes fadeinup {
            from { opacity: 0; transform: translateY(60px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .app-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 18px;
            background: none;
            border: none;
            box-shadow: none;
            animation: none;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .app-title {
            font-size: 1.7rem;
            font-weight: 900;
            color: #c28c19;
            margin-bottom: 7px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px #fbb04022;
        }
        .app-desc {
            color: #444;
            font-size: 1.05rem;
            margin-bottom: 22px;
            font-weight: 500;
        }
        .download-btn {
            display: flex;
            flex-direction: column;
            gap: 13px;
            margin-bottom: 10px;
        }
        .btn-apk {
            background: linear-gradient(90deg, #d72638 60%, #fbb040 100%);
            color: #fff;
            border: none;
            border-radius: 32px;
            font-size: 1.08rem;
            font-weight: 700;
            padding: 14px 0;
            width: 100%;
            margin-bottom: 4px;
            cursor: pointer;
            transition: transform 0.18s, box-shadow 0.18s, background 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px #d7263820;
            position: relative;
            overflow: hidden;
            animation: btnpop 1.1s cubic-bezier(.77,0,.18,1) 0.7s both;
        }
        .btn-apk img {
            width: 26px;
            height: 26px;
            margin-right: 12px;
        }
        .btn-apk:hover {
            transform: scale(1.04) translateY(-1px) rotate(-1deg);
            box-shadow: 0 6px 18px #fbb04060, 0 2px 8px #d7263820;
            background: linear-gradient(90deg, #fbb040 0%, #d72638 100%);
        }
        @keyframes btnpop {
            from { opacity: 0; transform: scale(0.8) translateY(40px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .btn-store {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 28px;
            font-size: 1rem;
            font-weight: 500;
            padding: 11px 0;
            width: 100%;
            cursor: not-allowed;
            opacity: 0.5;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-store img {
            width: 22px;
            height: 22px;
            margin-right: 10px;
        }
        .svg-wave {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            width: 100vw;
            z-index: 1;
            pointer-events: none;
        }
        @media (max-width: 500px) {
            body {
                align-items: center;
                justify-content: center;
            }
            .container {
                padding: 14px 2vw 16px 2vw;
                max-width: 99vw;
                margin: 0;
            }
            .app-title { font-size: 1.13rem; margin-bottom: 5px; }
            .app-logo { width: 54px; height: 54px; margin-bottom: 12px; }
            .app-desc { font-size: 0.97rem; margin-bottom: 15px; }
            .btn-apk { font-size: 0.98rem; padding: 11px 0; }
            .btn-apk img { width: 19px; height: 19px; margin-right: 8px; }
            .btn-store { font-size: 0.93rem; padding: 8px 0; border-radius: 20px; }
            .btn-store img { width: 16px; height: 16px; margin-right: 7px; }
            .download-btn { gap: 8px; }
        }
    </style>
</head>
<body>
    <canvas class="particles"></canvas>
    <div class="container">
        <img src="images/logo.png" alt="Ấm Coffee & Cake" class="app-logo">
        <div class="app-title">Ấm Coffee & Cake App</div>
        <div class="app-desc">Tải ứng dụng để đặt món, tích điểm và nhận ưu đãi độc quyền từ Ấm!</div>
        <div class="download-btn">
            <a href="amcoffeeandcakeapp.apk" class="btn-apk" download>
                <img src="https://img.icons8.com/ios-filled/50/ffffff/android-os.png" alt="APK">
                Tải file APK cho Android
            </a>
            <a href="#" class="btn-store" style="background:#000;">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/mac-os.png" alt="App Store">
                Tải xuống trên App Store
            </a>
            <a href="#" class="btn-store" style="background:#222;">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/google-play.png" alt="Google Play">
                Tải về Google Play
            </a>
            <a href="#" class="btn-store" style="background:#232f3e;">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/amazon.png" alt="Amazon">
                Có sẵn tại Amazon.com
            </a>
        </div>
    </div>
    <svg class="svg-wave" viewBox="0 0 1440 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="#fff" fill-opacity="0.9" d="M0,120 C360,200 1080,40 1440,120 L1440,180 L0,180 Z"></path>
        <path fill="#fbb040" fill-opacity="0.25" d="M0,160 C400,100 1040,220 1440,160 L1440,180 L0,180 Z"></path>
    </svg>
    <script>
    // Hiệu ứng particles nổi bồng bềnh
    const canvas = document.querySelector('.particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    function createParticles() {
        particles = [];
        for (let i = 0; i < 32; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height * 0.7,
                r: 8 + Math.random() * 16,
                d: 0.5 + Math.random() * 1.5,
                alpha: 0.12 + Math.random() * 0.18,
                color: Math.random() > 0.5 ? '#d72638' : '#fbb040',
                dx: (Math.random() - 0.5) * 0.3,
                dy: 0.2 + Math.random() * 0.3
            });
        }
    }
    createParticles();
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let p of particles) {
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 16;
            ctx.fill();
            ctx.shadowBlur = 0;
            p.x += p.dx;
            p.y += p.dy;
            if (p.y - p.r > canvas.height * 0.85) {
                p.y = -p.r;
                p.x = Math.random() * canvas.width;
            }
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
    }
    animate();
    // Tạo lại particles khi resize lớn
    window.addEventListener('resize', createParticles);
    </script>
</body>
</html>
