<!--
  File: MessengerChat.html
  Công dụng:
    - Trang chat chi tiết giữa hai người dùng.
  Các chức năng chính:
    1. Hiển thị lịch sử tin nhắn giữa hai người.
    2. Cho phép gửi tin nhắn mới, có thể gửi ảnh, emoji.
    3. Sử dụng Firebase Realtime Database để đồng bộ tin nhắn realtime.
    4. Giao diện giống các app chat phổ biến, tối ưu cho mobile/desktop.
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Ấm Messenger</title>
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { background: #f5f6fa; margin: 0; font-family: 'Roboto', Arial, sans-serif; }
    .main-chat { min-height: 100vh; height: 100%; display: flex; flex-direction: column; max-width: 540px; margin: 0 auto; box-sizing: border-box; }
    .chat-header { background: #fff; display: flex; align-items: center; gap: 12px; padding: 18px 18px; border-radius: 18px 18px 0 0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .chat-header-avatar { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; background: #e0e0e0; display: flex; align-items: center; justify-content: center; border: 2.5px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .chat-header-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name { font-weight: 700; color: #222; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.2px; }
    .chat-header-status { color: #4caf50; font-size: 15px; margin-top: 2px; }
    .chat-back-btn { background: none; border: none; font-size: 26px; color: #a67c52; margin-right: 12px; transition: color 0.18s, background 0.18s; border-radius: 50%; padding: 6px; }
    .chat-back-btn:hover { background: #f0f2f5; color: #222; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 28px 18px 18px 18px; display: flex; flex-direction: column; gap: 14px; background: #f7f7f7; border-radius: 0 0 0 0; }
    .message-row { display: flex; align-items: flex-end; gap: 10px; }
    .message-row.own { flex-direction: row-reverse; }
    .message-bubble { max-width: 70%; background: #e4e6eb; border-radius: 18px; padding: 14px 20px; font-size: 18px; color: #222; box-shadow: 0 1px 4px rgba(0,0,0,0.04); word-break: break-word; position: relative; }
    .message-row.own .message-bubble { background: #aee1fb; color: #222; }
    .message-row:first-child { margin-top: 8px; }
    .messages-container { padding: 10px 0; }
    .message-time { font-size: 13px; color: #888; margin: 0 8px; }
    .chat-input-bar { background: #fff; border-top: 1px solid #e4e6ea; padding: 16px 14px; display: flex; align-items: center; gap: 12px; border-radius: 0 0 18px 18px; box-shadow: 0 -2px 8px rgba(0,0,0,0.04); }
    .chat-input { flex: 1; border-radius: 22px; border: 1.5px solid #e4e6ea; padding: 14px 18px; font-size: 18px; outline: none; background: #f7f7f7; color: #222; transition: box-shadow 0.18s, background 0.18s; }
    .chat-input:focus { background: #fff; color: #222; box-shadow: 0 2px 12px rgba(0,0,0,0.10); border-color: #a67c52; }
    .chat-send-btn { background: #a67c52; color: #fff; border: none; border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .chat-send-btn:hover { background: #f0f2f5; color: #a67c52; }
    .chat-send-btn img, .chat-send-btn i { width: 26px; height: 26px; object-fit: contain; font-size: 26px; }
    .chat-call-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: #4caf50;
      margin-left: 8px;
      cursor: pointer;
      border-radius: 50%;
      padding: 6px;
      transition: background 0.18s, color 0.18s;
    }
    .chat-call-btn:hover { background: #f0f2f5; color: #222; }
    @media (min-width: 900px) {
      body { background: #f5f6fa; }
      .main-chat {
        max-width: 100%;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        border: none;
        background: #fff;
      }
      .chat-header { padding: 40px 60px; border-radius: 0; }
      .chat-header-avatar { width: 100px; height: 100px; }
      .chat-header-name { font-size: 38px; }
      .chat-header-status { font-size: 22px; }
      .chat-messages { padding: 48px 60px 40px 60px; }
      .chat-input-bar { padding: 32px 60px; border-radius: 0; }
      .chat-input { font-size: 28px; padding: 24px 32px; }
      .chat-send-btn { width: 70px; height: 70px; font-size: 36px; }
      .chat-send-btn img, .chat-send-btn i { width: 40px; height: 40px; font-size: 40px; }
      .message-bubble { font-size: 26px; padding: 22px 32px; }
      .message-time { font-size: 20px; }
    }
    @media (max-width: 550px) {
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #f5f6fa;
        overflow: hidden;
      }
      .main-chat {
        max-width: 100%;
        min-height: 100vh;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 0;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        background: #fff;
      }
      .chat-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
        border-radius: 0;
        padding: 12px 12px;
        box-sizing: border-box;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        height: 70px;
      }
      .chat-input-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 10;
        border-radius: 0;
        padding: 8px 8px;
        box-sizing: border-box;
        background: #fff;
        box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
        height: 70px;
      }
      .chat-messages {
        flex: 1;
        margin-top: 70px;
        margin-bottom: 70px;
        padding: 16px 8px 24px 8px;
        overflow-y: auto;
        height: calc(100vh - 140px);
        min-height: 0;
        background: #f7f7f7;
        box-sizing: border-box;
      }
      .message-bubble {
        max-width: 70%;
        word-break: break-word;
        font-size: 16px;
        padding: 10px 16px;
        border-radius: 16px;
      }
      .message-row {
        margin-bottom: 12px;
      }
      
      .message-row:last-child {
        margin-bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="main-chat">
    <div class="chat-header" id="chatHeader">
      <button class="chat-back-btn" id="backBtn"><i class="fa fa-arrow-left"></i></button>
      <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatHeaderName">Tên bạn bè</div>
        <div class="chat-header-status" id="chatHeaderStatus"></div>
      </div>
      <button class="chat-call-btn" id="voiceCallBtn" title="Gọi thoại"><i class="fa fa-phone"></i></button>
      <button class="chat-call-btn" id="videoCallBtn" title="Gọi video"><i class="fa fa-video-camera"></i></button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-bar">
      <!-- <button class="chat-send-btn" id="emojiBtn"><i class="fa fa-smile-o"></i></button> -->
      <button class="chat-send-btn" id="imageBtn"><img src="https://cdn-icons-png.freepik.com/256/14873/14873787.png?uid=R62207786&ga=GA1.1.635552943.1743728016&semt=ais_incoming" style="width:50px;height:50px;object-fit:contain;"></button>
      <textarea class="chat-input" id="chatInput" placeholder="Nhập tin nhắn..." rows="1" style="resize:none;" disabled></textarea>
      <button class="chat-send-btn" id="sendBtn" disabled><img src="https://cdn-icons-png.freepik.com/256/17731/17731920.png?uid=R62207786&ga=GA1.1.635552943.1743728016&semt=ais_incoming" alt="Gửi" style="width:50px;height:50px;object-fit:contain;"></button>
    </div>
  </div>
  <input type="file" id="chatImageInput" accept="image/*" style="display:none;">
  <!-- Modal giao diện cuộc gọi hiện đại -->
  <div id="callModal" class="call-modal-overlay" style="display:none;">
    <div class="call-modal-fullscreen">
      <div class="call-header">
        <div class="call-user-info">
          <img id="callAvatar" class="call-avatar" src="images/LOGO.png" alt="Avatar">
          <div class="call-username" id="callUsername">Tên bạn bè</div>
          <div class="call-status" id="callStatus">Đang gọi...</div>
        </div>
        <div class="call-timer" id="callTimer">00:00</div>
      </div>
      <div class="call-video-area" id="callVideoArea">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted class="local-video-pip"></video>
        <audio id="remoteAudio" autoplay style="display:none;"></audio>
      </div>  
      <div class="call-controls">
        <button id="toggleMicBtn" class="call-btn"><i class="fa fa-microphone"></i></button>
        <button id="toggleCameraBtn" class="call-btn"><img src="https://images.icon-icons.com/1131/PNG/512/photocamera1_80385.png" alt="Bật camera" style="width:26px;height:26px;object-fit:contain;"></button>
        <button id="minimizeCallBtn" class="call-btn minimize"><i class="fa fa-compress"></i></button>
        <button id="acceptCallBtn" class="call-btn accept"><i class="fa fa-phone"></i></button>
        <button id="rejectCallBtn" class="call-btn reject"><i class="fa fa-phone"></i></button>
        <button id="endCallBtn" class="call-btn end"><i class="fa fa-phone"></i></button>
      </div>
    </div>
  </div>
  
  <!-- Mini call view (picture-in-picture) -->
  <div id="miniCallView" class="mini-call-view" style="display:none;">
    <div class="mini-call-content">
      <div class="mini-call-video">
        <video id="miniRemoteVideo" autoplay playsinline muted></video>
      </div>
      <div class="mini-call-info">
        <div class="mini-call-name" id="miniCallName">Tên bạn bè</div>
        <div class="mini-call-timer" id="miniCallTimer">00:00</div>
      </div>
      <div class="mini-call-buttons">
        <button id="expandCallBtn" class="mini-call-btn expand"><i class="fa fa-arrows-alt"></i></button>
        <button id="miniEndCallBtn" class="mini-call-btn end"><i class="fa fa-phone"></i></button>
      </div>
    </div>
  </div>
  <!-- Mini modal cuộc gọi đến -->
  <div id="incomingCallModal" class="fb-incoming-modal">
    <div class="fb-incoming-content">
      <img id="incomingCallAvatar" class="fb-incoming-avatar" src="images/default-avatar.png">
      <div id="incomingCallName" class="fb-incoming-name">Tên bạn bè</div>
      <div id="incomingCallStatus" class="fb-incoming-status">Có cuộc gọi đến...</div>
      <div class="fb-incoming-btns">
        <button id="acceptIncomingCallBtn" class="fb-incoming-btn accept"><i class="fa fa-phone"></i></button>
        <button id="rejectIncomingCallBtn" class="fb-incoming-btn reject"><i class="fa fa-phone fa-rotate-180"></i></button>
      </div>
    </div>
  </div>
  <style>
    .call-modal-overlay {
      position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; z-index: 99999;
      margin: 0; padding: 0;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }
    .call-modal-fullscreen {
      width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; background: transparent; margin: 0; padding: 0;
      box-sizing: border-box;
    }
    .call-header {
      width: 100vw; max-width: 100vw; display: flex; justify-content: space-between; align-items: flex-start; padding: 32px 4vw 0 4vw; box-sizing: border-box;
      pointer-events: none;
    }
    .call-user-info { display: flex; flex-direction: column; align-items: flex-start; pointer-events: auto; }
    .call-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 6px; box-shadow: 0 2px 12px #0008; border: 3px solid #fff; }
    .call-username { font-size: 28px; font-weight: 700; color: #222; text-shadow: 0 2px 8px #fff8; }
    .call-status { color: #a67c52; font-size: 18px; margin-top: 2px; text-shadow: 0 2px 8px #fff8; }
    .call-timer { color: #222; font-size: 20px; font-weight: 600; background: rgba(255,255,255,0.7); border-radius: 8px; padding: 6px 18px; margin-top: 8px; align-self: flex-end; box-shadow: 0 2px 8px #0002; }
    .call-video-area {
      position: relative; flex: 1 1 auto; width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center;
      max-width: 100vw; max-height: 100vh; overflow: hidden;
    }
    .call-video-area.video {
      background: #fff;
    }
    #remoteVideo {
      width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
      object-fit: cover; background: #fff; border-radius: 32px; box-shadow: 0 2px 24px #0004;
      margin: 0 auto; display: block;
      transition: border-radius 0.2s;
    }
    .local-video-pip {
      position: absolute; right: 4vw; bottom: 4vw; width: 180px; height: 130px; border-radius: 18px; border: 3px solid #fff; box-shadow: 0 2px 12px #0008; background: #fff; z-index: 2;
      max-width: 30vw; max-height: 22vh; min-width: 60px; min-height: 40px;
      object-fit: cover;
    }
    .call-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px; /* Luôn cách mép dưới 24px */
      width: 100vw;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      z-index: 100000;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
    }
    .call-btn {
      width: 56px;
      height: 56px;
      min-width: 56px;
      min-height: 56px;
      max-width: 56px;
      max-height: 56px;
      font-size: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px #0001;
      margin: 0;
    }
    .call-btn.accept { background: #4caf50; color: #fff; box-shadow: 0 2px 12px #4caf5040; }
    .call-btn.reject, .call-btn.end { background: #d33; color: #fff; box-shadow: 0 2px 12px #d334; }
    .call-btn:active, .fb-incoming-btn:active { transform: scale(0.95); }
    @media (max-width: 900px) {
      .local-video-pip { width: 150px; height: 100px; right: 2vw; bottom: 15vw; }
      .call-header { padding: 16px 2vw 0 2vw; }
      .call-btn { width: 48px; height: 48px; font-size: 20px; }
      .call-avatar { width: 60px; height: 60px; }
    }
    @media (max-width: 600px), (max-height: 700px) {
      .call-controls {
        position: fixed !important;
        left: 0; right: 0;
        bottom: 16px; /* Dời lên cao hơn, có thể chỉnh 40px, 50px tùy ý */
        width: 100vw !important;
        background: rgba(255,255,255,0.98);
        gap: 16px !important;
        margin-bottom: 0 !important;
        padding: 0 !important;
        z-index: 100000;
        box-shadow: none;
        border-radius: 0 !important;
        justify-content: center !important;
      }
      .call-btn {
        width: 44px !important;
        height: 44px !important;
        font-size: 20px !important;
        min-width: 44px !important;
        min-height: 44px !important;
        max-width: 44px !important;
        max-height: 44px !important;
      }
    }
    @media (max-width: 400px) {
      .call-header, .call-controls { padding-left: 1vw; padding-right: 1vw; }
      .local-video-pip { min-width: 40px; min-height: 28px; }
    }

    /* Facebook Messenger style for mini modal */
    .fb-incoming-modal {
      display: none; position: fixed; z-index: 100000; left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(255,255,255,0.35); align-items: center; justify-content: center; backdrop-filter: blur(4px);
    }
    .fb-incoming-content {
      background: #fff; border-radius: 32px; padding: 38px 38px 28px 38px; box-shadow: 0 4px 32px 0 #0002, 0 1.5px 8px #0001;
      display: flex; flex-direction: column; align-items: center; min-width: 280px; max-width: 92vw;
      animation: fb-incoming-pop 0.25s cubic-bezier(.4,1.6,.6,1) 1;
    }
    .fb-incoming-avatar {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 12px #0002; margin-bottom: 16px; border: 3px solid #fff;
    }
    .fb-incoming-name {
      font-size: 26px; font-weight: 700; color: #222; margin-bottom: 6px; text-align: center;
    }
    .fb-incoming-status {
      color: #888; font-size: 16px; margin-bottom: 22px; text-align: center;
    }
    .fb-incoming-btns {
      display: flex; gap: 32px; margin-top: 8px;
    }
    .fb-incoming-btn {
      width: 64px; height: 64px; border-radius: 50%; font-size: 28px; border: none; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px #0002; cursor: pointer; transition: box-shadow 0.18s, background 0.18s, color 0.18s;
      background: #fff; color: #222;
    }
    .fb-incoming-btn.accept { background: #4caf50; color: #fff; box-shadow: 0 2px 12px #4caf5040; animation: fb-incoming-shake 1.2s infinite; }
    .fb-incoming-btn.reject { background: #d33; color: #fff; box-shadow: 0 2px 12px #d334; }
    .fb-incoming-btn:hover { filter: brightness(1.08); box-shadow: 0 4px 18px #0003; }
    @keyframes fb-incoming-pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fb-incoming-shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
      20%, 40%, 60%, 80% { transform: translateX(4px); }
    }
    
    /* Picture-in-picture mini call view */
    .mini-call-view {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 180px;
      height: 100px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 9998;
      overflow: hidden;
      display: none;
      transition: all 0.3s ease;
      border: 2px solid #fff;
    }
    .mini-call-content {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .mini-call-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f0f2f5;
      z-index: 1;
    }
    #miniRemoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mini-call-info {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 6px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
      color: #fff;
      z-index: 2;
      box-sizing: border-box;
    }
    .mini-call-name {
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-call-timer {
      font-size: 10px;
      opacity: 0.9;
    }
    .mini-call-buttons {
      position: absolute;
      bottom: 0;
      right: 0;
      display: flex;
      gap: 8px;
      padding: 6px;
      background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
      z-index: 2;
      box-sizing: border-box;
    }
    .mini-call-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      background: rgba(255,255,255,0.8);
      color: #222;
    }
    .mini-call-btn.end {
      background: #d33;
      color: #fff;
    }
    .mini-call-view:hover {
      transform: scale(1.05);
    }
    .mini-call-btn:active {
      transform: scale(0.9);
    }
    @media (max-width: 600px), (max-height: 700px) {
      .call-modal-fullscreen {
        padding: 0 !important;
        justify-content: flex-start !important;
      }
      .call-header {
        padding: 4px 2vw 0 2vw !important;
      }
      .call-avatar {
        width: 36px !important;
        height: 36px !important;
        margin-bottom: 2px !important;
      }
      .call-username {
        font-size: 16px !important;
      }
      .call-status {
        font-size: 12px !important;
      }
      .call-timer {
        font-size: 12px !important;
        padding: 2px 6px !important;
        margin-top: 2px !important;
      }
      .call-controls {
        position: fixed !important;
        left: 0; right: 0; bottom: 0;
        width: 100vw !important;
        background: rgba(255,255,255,0.95);
        gap: 8px !important;
        margin-bottom: 0 !important;
        padding: 6px 0 !important;
        z-index: 100000;
      }
      .call-btn {
        width: 36px !important;
        height: 36px !important;
        font-size: 15px !important;
        margin: 0 1px !important;
      }
      .call-video-area {
        min-height: 120px !important;
      }
    }
  </style>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getDatabase, ref, push, onValue, set, get, serverTimestamp, remove, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

window.uploadToCloudinary = async function(file) {
  const url = 'https://api.cloudinary.com/v1_1/dfdsj2ena/image/upload';
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'am_coffee_and_cake'); // đúng tên preset
  const res = await fetch(url, { method: 'POST', body: formData });
  const data = await res.json();
  if (data.secure_url) return data.secure_url;
  console.error('Cloudinary upload error:', data);
  throw new Error(data.error?.message || 'Upload ảnh thất bại!');
}

    function getConversationId(uid1, uid2) {
      return [uid1, uid2].sort().join('_');
    }
    let messageListener = null;
    function listenMessages() {
      if (!currentUser || !friendUid) return;
      if (messageListener) messageListener();
      const convId = getConversationId(currentUser.uid, friendUid);
      const msgRef = ref(database, 'messages/' + convId);
      messageListener = onValue(msgRef, (snap) => {
        let msgs = [];
        snap.forEach(child => {
          msgs.push({ id: child.key, ...child.val() });
        });
        msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        renderMessages(msgs);
      });
    }
    function renderMessages(msgs) {
      const msgDiv = document.getElementById('chatMessages');
      if (!msgDiv) return;
      if (!msgs || msgs.length === 0) {
        msgDiv.innerHTML = '<div style="color:#bbb;text-align:center;margin-top:40px;">Chưa có tin nhắn nào. Hãy bắt đầu cuộc trò chuyện!</div>';
        return;
      }
      
      // Thêm div wrapper để đảm bảo khoảng cách đầu và cuối
      let html = '<div class="messages-container">';
      
      html += msgs.map(m => {
        if (m.type === 'call') {
          // Hiển thị lịch sử cuộc gọi
          let icon = m.callType === 'video' ? 'fa-video-camera' : 'fa-phone';
          let color = m.status === 'ended' ? '#4caf50' : (m.status === 'rejected' ? '#d33' : (m.status === 'missed' ? '#d33' : '#a67c52'));
          let text = '';
          if (m.status === 'started') {
            text = m.sender === currentUser.uid ? 'Bạn đã bắt đầu cuộc gọi ' : 'Đối phương đã bắt đầu cuộc gọi ';
            text += m.callType === 'video' ? 'video.' : 'thoại.';
          } else if (m.status === 'ended') {
            let dur = '';
            if (typeof m.duration === 'number') {
              const min = Math.floor(m.duration/60).toString().padStart(2,'0');
              const sec = (m.duration%60).toString().padStart(2,'0');
              dur = ` (${min}:${sec})`;
            }
            text = (m.sender === currentUser.uid ? 'Bạn' : 'Đối phương') + ' đã kết thúc cuộc gọi ' + (m.callType === 'video' ? 'video' : 'thoại') + dur;
          } else if (m.status === 'rejected') {
            text = (m.sender === currentUser.uid ? 'Bạn' : 'Đối phương') + ' đã từ chối cuộc gọi ' + (m.callType === 'video' ? 'video.' : 'thoại.');
          } else if (m.status === 'missed') {
            if (m.role === 'caller') {
              text = (m.sender === currentUser.uid ? 'Đối phương không bắt máy.' : 'Bạn đã không bắt máy.');
            } else {
              text = (m.sender === currentUser.uid ? 'Bạn đã bỏ lỡ một cuộc gọi.' : 'Đối phương đã bỏ lỡ một cuộc gọi.');
            }
          }
          return `<div class="message-row call-log-row"><div class="message-bubble" style="background:#f0f2f5;color:#222;display:flex;align-items:center;gap:10px;font-style:italic;"><i class="fa ${icon}" style="color:${color};font-size:22px;"></i> ${text}</div><span class="message-time">${m.timestamp ? formatTimeAgo(m.timestamp) : ''}</span></div>`;
        } else {
          let text = m.text ? escapeHtml(m.text).replace(/\n/g, '<br>') : '';
          return `<div class="message-row${m.sender === currentUser.uid ? ' own' : ''}"><div class="message-bubble">${text}${m.image ? `<div style='margin-top:6px;'><img src='${m.image}' class='chat-image-view' style='max-width:180px;max-height:180px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.08);cursor:pointer;'></div>` : ''}</div><span class="message-time">${m.timestamp ? formatTimeAgo(m.timestamp) : ''}</span></div>`;
        }
      }).join('');
      
      // Đóng div wrapper
      html += '</div>';
      msgDiv.innerHTML = html;
      
      // Tăng thời gian chờ cho mobile
      const isMobile = window.innerWidth <= 600;
      setTimeout(() => { 
        msgDiv.scrollTop = msgDiv.scrollHeight; 
      }, isMobile ? 500 : 100);
    }
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function formatTimeAgo(ts) {
      if (!ts) return '';
      const now = Date.now();
      const diff = now - ts;
      const min = 60*1000, hour = 60*min, day = 24*hour;
      if (diff < min) return 'Vừa xong';
      if (diff < hour) return Math.floor(diff/min) + 'ph';
      if (diff < day) return Math.floor(diff/hour) + 'g';
      return new Date(ts).toLocaleDateString('vi-VN');
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text && !selectedImageFile) return;
      if (!currentUser || !friendUid) return;
      if (isUploading) return; // Không cho phép gửi khi đang upload
      
      const convId = getConversationId(currentUser.uid, friendUid);
      const db = getDatabase();

      // Đảm bảo hội thoại có members
      const metaRef = ref(db, 'conversationMeta/' + convId + '/members');
      await set(metaRef, {
        [currentUser.uid]: true,
        [friendUid]: true
      });

      // Tạo message mới
      const newMsg = {
        sender: currentUser.uid,
        text: text || '',
        timestamp: Date.now()
      };

      // Nếu có ảnh, upload lên Cloudinary trước
      if (selectedImageFile) {
        try {
          isUploading = true;
          // Disable nút gửi và hiển thị trạng thái upload
          const sendBtn = document.getElementById('sendBtn');
          const originalContent = sendBtn.innerHTML;
          sendBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
          sendBtn.disabled = true;
          
          const imageUrl = await uploadToCloudinary(selectedImageFile);
          newMsg.image = imageUrl;
          
          // Khôi phục nút gửi
          sendBtn.innerHTML = originalContent;
          sendBtn.disabled = false;
        } catch (error) {
          console.error('Lỗi upload ảnh:', error);
          alert('Không thể gửi ảnh. Vui lòng thử lại!');
          // Khôi phục nút gửi
          const sendBtn = document.getElementById('sendBtn');
          sendBtn.innerHTML = '<img src="https://cdn-icons-png.freepik.com/256/17731/17731920.png?uid=R62207786&ga=GA1.1.635552943.1743728016&semt=ais_incoming" alt="Gửi" style="width:50px;height:50px;object-fit:contain;">';
          sendBtn.disabled = false;
          isUploading = false;
          return;
        } finally {
          isUploading = false;
        }
      }

      // Push message vào Firebase
      const msgRef = ref(db, 'messages/' + convId);
      await push(msgRef, newMsg);
      await set(ref(db, 'conversationMeta/' + convId + '/lastMessage'), text ? text : (selectedImageFile ? '[Đã gửi ảnh]' : ''));
      await set(ref(db, 'conversationMeta/' + convId + '/updatedAt'), Date.now());
      
      input.value = '';
      selectedImageFile = null;
      
      // Thêm cuộn xuống sau khi gửi tin nhắn
      setTimeout(() => {
        const msgDiv = document.getElementById('chatMessages');
        if (msgDiv) msgDiv.scrollTop = msgDiv.scrollHeight;
      }, 300);
    }

async function startCall(type) {
  if (!window.currentUser || !window.friendUid) return;
  callType = type;
  callRoomId = getConvId();
  signalingRef = getSignalingRef();
  await cleanupCall();
  showCallModal(type, 'Đang gọi...');
  // Phát âm thanh gọi đi
  try { document.getElementById('callingSound').currentTime = 0; document.getElementById('callingSound').play(); } catch(e){}
  // Lưu message bắt đầu gọi
  const convId = getConvId();
  await push(ref(database, 'messages/' + convId), {
    sender: window.currentUser.uid,
    type: 'call',
    callType: type,
    status: 'started',
    timestamp: Date.now()
  });
  localStream = await navigator.mediaDevices.getUserMedia(type === 'video' ? { video: true, audio: true } : { audio: true });
  if (type === 'video') localVideo.srcObject = localStream;
  peerConnection = createPeerConnection(type);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  await set(signalingRef, {
    type: 'offer',
    from: window.currentUser.uid,
    to: window.friendUid,
    callType: type,
    offer: offer,
    timestamp: Date.now()
  });
  listenSignaling();
  // Đếm ngược 30s nếu không có answer thì tự end và lưu missed call
  if (callTimeout) clearTimeout(callTimeout);
  callTimeout = setTimeout(async () => {
    // Nếu chưa có answer (chưa vào giao diện trò chuyện)
    if (callModal.style.display === 'flex' && callStatus.textContent === 'Đang gọi...') {
      // Lưu message missed call (role: caller)
      const convId = getConvId();
      await push(ref(database, 'messages/' + convId), {
        sender: window.currentUser.uid,
        type: 'call',
        callType: type,
        status: 'missed',
        role: 'caller',
        timestamp: Date.now()
      });
      if (signalingRef) await set(signalingRef, { type: 'end' });
      cleanupCall();
    }
  }, 30000);
}
// --- Gửi trạng thái mic/camera qua signaling ---
function sendMediaStatus() {
  if (!signalingRef || !window.currentUser || !window.friendUid) return;
  const audioTrack = localStream && localStream.getAudioTracks()[0];
  const videoTrack = localStream && localStream.getVideoTracks()[0];
  set(signalingRef, {
    type: 'media-status',
    from: window.currentUser.uid,
    to: window.friendUid,
    mic: audioTrack ? audioTrack.enabled : null,
    camera: videoTrack ? videoTrack.enabled : null,
    callType: callType,
    timestamp: Date.now()
  });
}

function listenSignaling() {
  if (!signalingRef) signalingRef = getSignalingRef();
  off(signalingRef); // clear old
  onValue(signalingRef, async (snap) => {
    const data = snap.val();
    if (!data) return;
    if (data.type === 'offer' && data.to === window.currentUser.uid) {
      if (incomingCallModal.style.display !== 'flex' && callModal.style.display !== 'flex') {
        callType = data.callType;
        callRoomId = getConvId();
        signalingRef = getSignalingRef();
        incomingCallData = data;
        showIncomingCallModal(data);
      }
    } else if (data.type === 'answer' && data.to === window.currentUser.uid) {
      if (peerConnection && data.answer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        callStatus.textContent = 'Đang trò chuyện...';
        if (endCallBtn) endCallBtn.style.display = '';
        if (acceptCallBtn) acceptCallBtn.style.display = 'none';
        if (rejectCallBtn) rejectCallBtn.style.display = 'none';
        startCallTimer();
        stopAllCallSounds();
      }
    } else if (data.type === 'candidate' && data.to === window.currentUser.uid) {
      if (peerConnection && data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch {}
      }
    } else if (data.type === 'media-status' && data.to === window.currentUser.uid) {
      // Nhận trạng thái media đối phương
      if (typeof data.mic === 'boolean') remoteMediaStatus.mic = data.mic;
      if (typeof data.camera === 'boolean') remoteMediaStatus.camera = data.camera;
      showRemoteMediaStatus();
    } else if (data.type === 'end') {
      callStatus.textContent = 'Đã kết thúc cuộc gọi.';
      setTimeout(() => cleanupCall(), 800);
      hideIncomingCallModal();
      stopAllCallSounds();
    }
  });
}
setTimeout(() => listenSignaling(), 1000);
async function acceptCall(data) {
  console.log('[CALL] acceptCall chạy, data:', data, 'currentUser:', window.currentUser, 'friendUid:', window.friendUid);
  callType = data.callType;
  callRoomId = getConvId();
  signalingRef = getSignalingRef();
  showCallModal(callType, 'Đang kết nối...');
  try {
    localStream = await navigator.mediaDevices.getUserMedia(callType === 'video' ? { video: true, audio: true } : { audio: true });
  } catch (err) {
    console.error('[CALL] Lỗi getUserMedia:', err);
    alert('Không truy cập được camera/mic. Vui lòng kiểm tra quyền trình duyệt!');
    cleanupCall();
    return;
  }
  if (callType === 'video') localVideo.srcObject = localStream;
  peerConnection = createPeerConnection(callType);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  try {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    await set(signalingRef, {
      type: 'answer',
      from: window.currentUser.uid,
      to: window.friendUid,
      answer: answer,
      callType: callType,
      timestamp: Date.now()
    });
  } catch (err) {
    console.error('[CALL] Lỗi khi setRemoteDescription/createAnswer:', err);
    cleanupCall();
    return;
  }
  if (endCallBtn) endCallBtn.style.display = '';
  if (acceptCallBtn) acceptCallBtn.style.display = 'none';
  if (rejectCallBtn) rejectCallBtn.style.display = 'none';
  callStatus.textContent = 'Đang trò chuyện...';
  startCallTimer();
  console.log('[CALL] Đã vào giao diện gọi full màn hình!');
}
async function rejectCall() {
  // Lưu message từ chối cuộc gọi
  if (callType && window.currentUser && window.friendUid) {
    const convId = getConvId();
    await push(ref(database, 'messages/' + convId), {
      sender: window.currentUser.uid,
      type: 'call',
      callType: callType,
      status: 'rejected',
      timestamp: Date.now()
    });
  }
  if (signalingRef) await set(signalingRef, { type: 'end' });
  cleanupCall();
}
if (endCallBtn) endCallBtn.onclick = async function() {
  if (signalingRef) await set(signalingRef, { type: 'end' });
  cleanupCall();
};
function createPeerConnection(type) {
  const pc = new RTCPeerConnection(servers);
  pc.onicecandidate = (event) => {
    if (event.candidate) {
      set(signalingRef, {
        type: 'candidate',
        from: window.currentUser.uid,
        to: window.friendUid,
        candidate: event.candidate.toJSON(),
        callType: type,
        timestamp: Date.now()
      });
    }
  };
  pc.ontrack = (event) => {
    if (type === 'video') {
      remoteVideo.srcObject = event.streams[0];
      remoteVideo.style.display = 'block';
      remoteAudio.style.display = 'none';
    } else {
      remoteAudio.srcObject = event.streams[0];
      remoteAudio.style.display = 'block';
      remoteVideo.style.display = 'none';
    }
  };
  return pc;
}
async function cleanupCall() {
  // Lưu message kết thúc gọi nếu đang trong cuộc gọi
  if (callType && window.currentUser && window.friendUid && callStartTime) {
    const convId = getConvId();
    const duration = Math.floor((Date.now() - callStartTime) / 1000);
    await push(ref(database, 'messages/' + convId), {
      sender: window.currentUser.uid,
      type: 'call',
      callType: callType,
      status: 'ended',
      duration: duration,
      timestamp: Date.now()
    });
  }
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }
  if (remoteStream) {
    remoteStream = null;
  }
  hideCallModal();
  if (signalingRef) await remove(signalingRef);
}
callModal.onclick = function(e) {
  if (e.target === callModal) {
    // Khi click vào nền, thu nhỏ cuộc gọi thành picture-in-picture thay vì kết thúc
    minimizeCall();
  }
};
// --- Mic/Camera toggle ---
const toggleMicBtn = document.getElementById('toggleMicBtn');
if (toggleMicBtn) {
  toggleMicBtn.onclick = function() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      audioTrack.enabled = !audioTrack.enabled;
      const icon = toggleMicBtn.querySelector('i');
      if (audioTrack.enabled) {
        icon.className = 'fa fa-microphone';
        icon.style.color = '';
        toggleMicBtn.style.background = '';
      } else {
        icon.className = 'fa fa-microphone-slash';
        icon.style.color = '#d33';
        toggleMicBtn.style.background = '';
      }
      sendMediaStatus();
    }
  };
}
const toggleCameraBtn = document.getElementById('toggleCameraBtn');
if (toggleCameraBtn) {
  toggleCameraBtn.onclick = function() {
    if (!localStream) return;
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
      videoTrack.enabled = !videoTrack.enabled;
      const icon = toggleCameraBtn.querySelector('i');
      // Xóa tất cả <img> trong nút trước khi thêm mới
      const oldImgs = toggleCameraBtn.querySelectorAll('img');
      oldImgs.forEach(img => img.remove());
      if (videoTrack.enabled) {
        // Bật camera: dùng icon ảnh mở cam
        if (icon) icon.style.display = 'none';
        const img = document.createElement('img');
        img.src = 'https://images.icon-icons.com/1131/PNG/512/photocamera1_80385.png';
        img.alt = 'Bật camera';
        img.style.width = '26px';
        img.style.height = '26px';
        img.style.display = 'block';
        img.style.margin = 'auto';
        toggleCameraBtn.appendChild(img);
        toggleCameraBtn.style.background = '';
        toggleCameraBtn.style.border = '2px solid #222';
      } else {
        // Tắt camera: dùng icon ảnh tắt cam
        if (icon) icon.style.display = 'none';
        const img = document.createElement('img');
        img.src = 'https://img.icons8.com/?size=160&id=dJimH2tu43l4&format=png';
        img.alt = 'Tắt camera';
        img.style.width = '26px';
        img.style.height = '26px';
        img.style.display = 'block';
        img.style.margin = 'auto';
        toggleCameraBtn.appendChild(img);
        toggleCameraBtn.style.background = '';
        toggleCameraBtn.style.border = '2px solid #d33';
      }
      sendMediaStatus();
    }
  };
}
// --- Call Timer ---
let callTimerInterval = null;
let callStartTime = null;
function startCallTimer() {
  callStartTime = Date.now();
  const callTimer = document.getElementById('callTimer');
  const miniCallTimer = document.getElementById('miniCallTimer');
  
  if (callTimerInterval) clearInterval(callTimerInterval);
  callTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const sec = (elapsed % 60).toString().padStart(2, '0');
    const timeStr = `${min}:${sec}`;
    
    // Cập nhật cả hai timer
    if (callTimer) callTimer.textContent = timeStr;
    if (miniCallTimer) miniCallTimer.textContent = timeStr;
  }, 1000);
  
  if (callTimer) callTimer.textContent = '00:00';
  if (miniCallTimer) miniCallTimer.textContent = '00:00';
}
function stopCallTimer() {
  if (callTimerInterval) clearInterval(callTimerInterval);
  callTimerInterval = null;
  callStartTime = null;
  const callTimer = document.getElementById('callTimer');
  if (callTimer) callTimer.textContent = '00:00';
  const miniCallTimer = document.getElementById('miniCallTimer');
  if (miniCallTimer) miniCallTimer.textContent = '00:00';
}

// --- Picture-in-Picture (Mini Call View) ---
const miniCallView = document.getElementById('miniCallView');
const expandCallBtn = document.getElementById('expandCallBtn');
const miniEndCallBtn = document.getElementById('miniEndCallBtn');
const minimizeCallBtn = document.getElementById('minimizeCallBtn');
const miniRemoteVideo = document.getElementById('miniRemoteVideo');
const miniCallName = document.getElementById('miniCallName');
const miniCallTimer = document.getElementById('miniCallTimer');

// Hàm thu nhỏ cuộc gọi thành picture-in-picture
function minimizeCall() {
  // Chỉ thu nhỏ khi đang trong cuộc gọi (không phải đang gọi hoặc đang đổ chuông)
  if (callStatus.textContent !== 'Đang trò chuyện...') return;
  
  // Hiển thị mini view
  miniCallView.style.display = 'block';
  
  // Cập nhật thông tin
  miniCallName.textContent = document.getElementById('callUsername').textContent;
  miniCallTimer.textContent = document.getElementById('callTimer').textContent;
  
  // Cập nhật video
  if (callType === 'video' && remoteVideo.srcObject) {
    miniRemoteVideo.srcObject = remoteVideo.srcObject;
    miniRemoteVideo.style.display = 'block';
  } else {
    miniRemoteVideo.style.display = 'none';
  }
  
  // Ẩn modal chính
  callModal.style.display = 'none';
}

// Hàm mở rộng cuộc gọi từ picture-in-picture
function expandCall() {
  // Hiển thị modal chính
  callModal.style.display = 'flex';
  
  // Ẩn mini view
  miniCallView.style.display = 'none';
}

// Gán sự kiện cho các nút
if (minimizeCallBtn) {
  minimizeCallBtn.onclick = minimizeCall;
}

if (expandCallBtn) {
  expandCallBtn.onclick = expandCall;
}

if (miniEndCallBtn) {
  miniEndCallBtn.onclick = async function() {
    if (signalingRef) await set(signalingRef, { type: 'end' });
    cleanupCall();
  };
}

  <!-- Thêm MutationObserver để theo dõi thay đổi DOM -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const chatMessages = document.getElementById('chatMessages');
      if (chatMessages) {
        // Tạo MutationObserver để tự động cuộn xuống khi có tin nhắn mới
        const observer = new MutationObserver(() => {
          chatMessages.scrollTop = chatMessages.scrollHeight;
        });
        
        // Bắt đầu theo dõi thay đổi trong DOM
        observer.observe(chatMessages, { 
          childList: true, 
          subtree: true 
        });
        
        // Đảm bảo cuộn xuống khi trang tải xong
        setTimeout(() => {
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 800);
        
        // Thêm sự kiện resize để điều chỉnh kích thước khi thay đổi màn hình
        window.addEventListener('resize', function() {
          // Cập nhật lại chiều cao container tin nhắn
          const headerHeight = 70;
          const inputHeight = 70;
          chatMessages.style.height = `calc(100vh - ${headerHeight + inputHeight}px)`;
          
          // Cuộn xuống cuối cùng
          setTimeout(() => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }, 100);
        });
      }
    });
  </script>
