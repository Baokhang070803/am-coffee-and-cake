<!--
  File: MessengerChat.html
  Công dụng:
    - Trang chat chi tiết giữa hai người dùng.
  Các chức năng chính:
    1. Hiển thị lịch sử tin nhắn giữa hai người.
    2. Cho phép gửi tin nhắn mới, có thể gửi ảnh, emoji.
    3. Sử dụng Firebase Realtime Database để đồng bộ tin nhắn realtime.
    4. Giao diện giống các app chat phổ biến, tối ưu cho mobile/desktop.
-->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Ấm Messenger</title>
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { background: #f5f6fa; margin: 0; font-family: 'Roboto', Arial, sans-serif; }
    .main-chat { min-height: 100vh; height: 100%; display: flex; flex-direction: column; max-width: 540px; margin: 0 auto; box-sizing: border-box; }
    .chat-header { background: #fff; display: flex; align-items: center; gap: 12px; padding: 18px 18px; border-radius: 18px 18px 0 0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .chat-header-avatar { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; background: #e0e0e0; display: flex; align-items: center; justify-content: center; border: 2.5px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .chat-header-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name { font-weight: 700; color: #222; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.2px; }
    .chat-header-status { color: #4caf50; font-size: 15px; margin-top: 2px; }
    .chat-back-btn { background: none; border: none; font-size: 26px; color: #a67c52; margin-right: 12px; transition: color 0.18s, background 0.18s; border-radius: 50%; padding: 6px; }
    .chat-back-btn:hover { background: #f0f2f5; color: #222; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 28px 18px 18px 18px; display: flex; flex-direction: column; gap: 14px; background: #f7f7f7; border-radius: 0 0 0 0; }
    .message-row { display: flex; align-items: flex-end; gap: 10px; }
    .message-row.own { flex-direction: row-reverse; }
    .message-bubble { max-width: 70%; background: #e4e6eb; border-radius: 18px; padding: 14px 20px; font-size: 18px; color: #222; box-shadow: 0 1px 4px rgba(0,0,0,0.04); word-break: break-word; position: relative; }
    .message-row.own .message-bubble { background: #aee1fb; color: #222; }
    .message-time { font-size: 13px; color: #888; margin: 0 8px; }
    .chat-input-bar { background: #fff; border-top: 1px solid #e4e6ea; padding: 16px 14px; display: flex; align-items: center; gap: 12px; border-radius: 0 0 18px 18px; box-shadow: 0 -2px 8px rgba(0,0,0,0.04); }
    .chat-input { flex: 1; border-radius: 22px; border: 1.5px solid #e4e6ea; padding: 14px 18px; font-size: 18px; outline: none; background: #f7f7f7; color: #222; transition: box-shadow 0.18s, background 0.18s; }
    .chat-input:focus { background: #fff; color: #222; box-shadow: 0 2px 12px rgba(0,0,0,0.10); border-color: #a67c52; }
    .chat-send-btn { background: #a67c52; color: #fff; border: none; border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .chat-send-btn:hover { background: #f0f2f5; color: #a67c52; }
    .chat-send-btn img, .chat-send-btn i { width: 26px; height: 26px; object-fit: contain; font-size: 26px; }
    .chat-call-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: #4caf50;
      margin-left: 8px;
      cursor: pointer;
      border-radius: 50%;
      padding: 6px;
      transition: background 0.18s, color 0.18s;
    }
    .chat-call-btn:hover { background: #f0f2f5; color: #222; }
    @media (min-width: 900px) {
      body { background: #f5f6fa; }
      .main-chat {
        max-width: 100vw;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        border: none;
        background: #fff;
        /* height: 100vh; */ /* Bỏ dòng này luôn */
      }
      .chat-header { padding: 40px 60px; border-radius: 0; }
      .chat-header-avatar { width: 100px; height: 100px; }
      .chat-header-name { font-size: 38px; }
      .chat-header-status { font-size: 22px; }
      .chat-messages { padding: 48px 60px 40px 60px; }
      .chat-input-bar { padding: 32px 60px; border-radius: 0; }
      .chat-input { font-size: 28px; padding: 24px 32px; }
      .chat-send-btn { width: 70px; height: 70px; font-size: 36px; }
      .chat-send-btn img, .chat-send-btn i { width: 40px; height: 40px; font-size: 40px; }
      .message-bubble { font-size: 26px; padding: 22px 32px; }
      .message-time { font-size: 20px; }
    }
    @media (max-width: 600px) {
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #f5f6fa;
        overflow: hidden;
      }
      .main-chat {
        max-width: 100vw;
        min-height: 100vh;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 0;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        background: #fff;
      }
      .chat-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        z-index: 10;
        border-radius: 0;
        padding: 12px 12px;
        box-sizing: border-box;
      }
      .chat-input-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100vw;
        z-index: 10;
        border-radius: 0;
        padding: 8px 8px;
        box-sizing: border-box;
      }
      .chat-messages {
        flex: 1;
        margin-top: 70px;   /* chiều cao header */
        margin-bottom: 70px; /* chiều cao input bar */
        padding: 8px 8px;
        overflow-y: auto;
        height: auto;
        min-height: 0;
        background: #f7f7f7;
      }
      .message-bubble {
        max-width: 80vw;
        word-break: break-word;
        font-size: 16px;
        padding: 10px 16px;
        border-radius: 16px;
      }
      .message-row {
        margin-bottom: 8px;
      }
    }
  </style>
</head>
<body>

    <div class="chat-input-bar">
      <!-- <button class="chat-send-btn" id="emojiBtn"><i class="fa fa-smile-o"></i></button> -->
      <button class="chat-send-btn" id="imageBtn"><img src="https://cdn-icons-png.freepik.com/256/14873/14873787.png?uid=R62207786&ga=GA1.1.635552943.1743728016&semt=ais_incoming" style="width:50px;height:50px;object-fit:contain;"></button>

  </div>
  <input type="file" id="chatImageInput" accept="image/*" style="display:none;">
  <!-- Modal giao diện cuộc gọi hiện đại -->
  <div id="callModal" class="call-modal-overlay" style="display:none;">
    <div class="call-modal-fullscreen">
      <div class="call-header">
        <div class="call-user-info">
          <img id="callAvatar" class="call-avatar" src="images/default-avatar.png" alt="Avatar">
          <div class="call-username" id="callUsername">Tên bạn bè</div>
          <div class="call-status" id="callStatus">Đang gọi...</div>
        </div>
        <div class="call-timer" id="callTimer">00:00</div>
      </div>

      </div>
    </div>
  </div>
  <!-- Mini modal cuộc gọi đến -->
  <div id="incomingCallModal" class="fb-incoming-modal">
    <div class="fb-incoming-content">
      <img id="incomingCallAvatar" class="fb-incoming-avatar" src="images/default-avatar.png">
      <div id="incomingCallName" class="fb-incoming-name">Tên bạn bè</div>
      <div id="incomingCallStatus" class="fb-incoming-status">Có cuộc gọi đến...</div>
      <div class="fb-incoming-btns">
        <button id="acceptIncomingCallBtn" class="fb-incoming-btn accept"><i class="fa fa-phone"></i></button>
        <button id="rejectIncomingCallBtn" class="fb-incoming-btn reject"><i class="fa fa-phone fa-rotate-180"></i></button>
      </div>
    </div>
  </div>
  <style>
    .call-modal-overlay {
      position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; z-index: 99999;
      margin: 0; padding: 0;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }
    .call-modal-fullscreen {
      width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; background: transparent; margin: 0; padding: 0;
      box-sizing: border-box;
    }
    .call-header {
      width: 100vw; max-width: 100vw; display: flex; justify-content: space-between; align-items: flex-start; padding: 32px 4vw 0 4vw; box-sizing: border-box;
      pointer-events: none;
    }
    .call-user-info { display: flex; flex-direction: column; align-items: flex-start; pointer-events: auto; }
    .call-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 6px; box-shadow: 0 2px 12px #0008; border: 3px solid #fff; }
    .call-username { font-size: 28px; font-weight: 700; color: #222; text-shadow: 0 2px 8px #fff8; }
    .call-status { color: #a67c52; font-size: 18px; margin-top: 2px; text-shadow: 0 2px 8px #fff8; }
    .call-timer { color: #222; font-size: 20px; font-weight: 600; background: rgba(255,255,255,0.7); border-radius: 8px; padding: 6px 18px; margin-top: 8px; align-self: flex-end; box-shadow: 0 2px 8px #0002; }
    .call-video-area {
      position: relative; flex: 1 1 auto; width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center;
      max-width: 100vw; max-height: 100vh; overflow: hidden;
    }
    .call-video-area.video {
      background: #fff;
    }
    #remoteVideo {
      width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
      object-fit: cover; background: #fff; border-radius: 32px; box-shadow: 0 2px 24px #0004;
      margin: 0 auto; display: block;
      transition: border-radius 0.2s;
    }
    .local-video-pip {
      position: absolute; right: 4vw; bottom: 4vw; width: 180px; height: 130px; border-radius: 18px; border: 3px solid #fff; box-shadow: 0 2px 12px #0008; background: #fff; z-index: 2;
      max-width: 30vw; max-height: 22vh; min-width: 60px; min-height: 40px;
      object-fit: cover;
    }
    .call-controls {
      width: 100vw; max-width: 100vw; display: flex; justify-content: center; gap: 38px; margin-bottom: 48px; z-index: 3;

      box-sizing: border-box;
    }
    .call-btn {
      width: 68px; height: 68px; border-radius: 50%; font-size: 30px; border: none; background: #fff; color: #222; cursor: pointer; box-shadow: 0 2px 12px #0002;

      margin: 0 2px;

    .call-btn.accept { background: #4caf50; color: #fff; box-shadow: 0 2px 12px #4caf5040; }

    @media (max-width: 900px) {
      .local-video-pip { width: 100px; height: 70px; right: 2vw; bottom: 2vw; }
      .call-header { padding: 16px 2vw 0 2vw; }
      .call-btn { width: 48px; height: 48px; font-size: 20px; }
      .call-avatar { width: 60px; height: 60px; }
    }
    @media (max-width: 600px) {
      .call-modal-fullscreen { padding: 0; }
      .call-header { padding: 6px 2vw 0 2vw; }
      .call-user-info { align-items: flex-start; }
      .call-avatar { width: 36px; height: 36px; }

      .call-btn { width: 38px; height: 38px; font-size: 15px; }

      .call-header, .call-controls { padding-left: 1vw; padding-right: 1vw; }
      .local-video-pip { min-width: 40px; min-height: 28px; }

    /* Facebook Messenger style for mini modal */
    .fb-incoming-modal {
      display: none; position: fixed; z-index: 100000; left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(255,255,255,0.35); align-items: center; justify-content: center; backdrop-filter: blur(4px);
    }
    .fb-incoming-content {
      background: #fff; border-radius: 32px; padding: 38px 38px 28px 38px; box-shadow: 0 4px 32px 0 #0002, 0 1.5px 8px #0001;
      display: flex; flex-direction: column; align-items: center; min-width: 280px; max-width: 92vw;
      animation: fb-incoming-pop 0.25s cubic-bezier(.4,1.6,.6,1) 1;
    }
    .fb-incoming-avatar {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 12px #0002; margin-bottom: 16px; border: 3px solid #fff;
    }
    .fb-incoming-name {
      font-size: 26px; font-weight: 700; color: #222; margin-bottom: 6px; text-align: center;
    }
    .fb-incoming-status {
      color: #888; font-size: 16px; margin-bottom: 22px; text-align: center;
    }
    .fb-incoming-btns {
      display: flex; gap: 32px; margin-top: 8px;
    }
    .fb-incoming-btn {
      width: 64px; height: 64px; border-radius: 50%; font-size: 28px; border: none; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px #0002; cursor: pointer; transition: box-shadow 0.18s, background 0.18s, color 0.18s;
      background: #fff; color: #222;
    }
    .fb-incoming-btn.accept { background: #4caf50; color: #fff; box-shadow: 0 2px 12px #4caf5040; animation: fb-incoming-shake 1.2s infinite; }
    .fb-incoming-btn.reject { background: #d33; color: #fff; box-shadow: 0 2px 12px #d334; }
    .fb-incoming-btn:hover { filter: brightness(1.08); box-shadow: 0 4px 18px #0003; }
    @keyframes fb-incoming-pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fb-incoming-shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
      20%, 40%, 60%, 80% { transform: translateX(4px); }
    }
  </style>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getDatabase, ref, push, onValue, set, get, serverTimestamp, remove, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

// --- Firebase config ---
const firebaseConfig = {
      apiKey: "AIzaSyA5NhPnsfXEUbXYzkdB5kvfaE0swtViJaI",
      authDomain: "coffee-and-cake-e2f5d.firebaseapp.com",
      databaseURL: "https://coffee-and-cake-e2f5d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "coffee-and-cake-e2f5d",
      storageBucket: "coffee-and-cake-e2f5d.appspot.com",
      messagingSenderId: "453243002159",
      appId: "1:453243002159:web:074baa5652ed789ecbd5da",
      measurementId: "G-1H7DM8MQCV"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

// --- Biến toàn cục ---
let currentUser = null;
let friendUid = getQueryUid();
let friendInfo = null;
let friendsList = [];
let callTimeout = null;
let incomingCallTimeout = null;
window.friendUid = friendUid;
window.currentUser = currentUser;

// --- Helper: lấy uid từ query string ---
    function getQueryUid() {
      const params = new URLSearchParams(window.location.search);
      return params.get('uid');
    }

// --- Helper: getConvId, getSignalingRef ---
function getConvId() {
  if (!window.currentUser || !window.friendUid) return null;
  return [window.currentUser.uid, window.friendUid].sort().join('_');
}
function getSignalingRef() {
  return ref(database, 'calls/' + getConvId());
}
window.getConvId = getConvId;
window.getSignalingRef = getSignalingRef;

// --- Auth state ---
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
  window.currentUser = currentUser;
      if (user && friendUid) loadFriendInfo();
    });

// --- Load friend info ---
    async function loadFriendInfo() {
      const friendSnap = await get(ref(database, 'users/' + friendUid));
      if (friendSnap.exists()) {
        friendInfo = friendSnap.val();
        document.getElementById('chatHeaderAvatar').innerHTML = friendInfo.avatarUrl ? `<img src='${friendInfo.avatarUrl}'>` : '';
        document.getElementById('chatHeaderName').textContent = friendInfo.name || friendInfo.displayName || friendInfo.email || 'Người dùng';
      }
      document.getElementById('chatHeaderStatus').textContent = '';
      document.getElementById('chatInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      listenMessages();
    }

// --- Chat logic ---
    function getConversationId(uid1, uid2) {
      return [uid1, uid2].sort().join('_');
    }
    let messageListener = null;
    function listenMessages() {
      if (!currentUser || !friendUid) return;
      if (messageListener) messageListener();
      const convId = getConversationId(currentUser.uid, friendUid);
      const msgRef = ref(database, 'messages/' + convId);
      messageListener = onValue(msgRef, (snap) => {
        let msgs = [];
        snap.forEach(child => {
          msgs.push({ id: child.key, ...child.val() });
        });
        msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
        renderMessages(msgs);
      });
    }
    function renderMessages(msgs) {
      const msgDiv = document.getElementById('chatMessages');
      if (!msgDiv) return;
      if (!msgs || msgs.length === 0) {
        msgDiv.innerHTML = '<div style="color:#bbb;text-align:center;margin-top:40px;">Chưa có tin nhắn nào. Hãy bắt đầu cuộc trò chuyện!</div>';
        return;
      }
      msgDiv.innerHTML = msgs.map(m => {
        if (m.type === 'call') {
          // Hiển thị lịch sử cuộc gọi
          let icon = m.callType === 'video' ? 'fa-video-camera' : 'fa-phone';
          let color = m.status === 'ended' ? '#4caf50' : (m.status === 'rejected' ? '#d33' : (m.status === 'missed' ? '#d33' : '#a67c52'));
          let text = '';
          if (m.status === 'started') {
            text = m.sender === currentUser.uid ? 'Bạn đã bắt đầu cuộc gọi ' : 'Đối phương đã bắt đầu cuộc gọi ';
            text += m.callType === 'video' ? 'video.' : 'thoại.';
          } else if (m.status === 'ended') {
            let dur = '';
            if (typeof m.duration === 'number') {
              const min = Math.floor(m.duration/60).toString().padStart(2,'0');
              const sec = (m.duration%60).toString().padStart(2,'0');
              dur = ` (${min}:${sec})`;
            }
            text = (m.sender === currentUser.uid ? 'Bạn' : 'Đối phương') + ' đã kết thúc cuộc gọi ' + (m.callType === 'video' ? 'video' : 'thoại') + dur;
          } else if (m.status === 'rejected') {
            text = (m.sender === currentUser.uid ? 'Bạn' : 'Đối phương') + ' đã từ chối cuộc gọi ' + (m.callType === 'video' ? 'video.' : 'thoại.');
          } else if (m.status === 'missed') {
            if (m.role === 'caller') {
              text = (m.sender === currentUser.uid ? 'Đối phương không bắt máy.' : 'Bạn đã không bắt máy.');
            } else {
              text = (m.sender === currentUser.uid ? 'Bạn đã bỏ lỡ một cuộc gọi.' : 'Đối phương đã bỏ lỡ một cuộc gọi.');
            }
          }

        } else {
          return `<div class="message-row${m.sender === currentUser.uid ? ' own' : ''}"><div class="message-bubble">${m.text ? escapeHtml(m.text) : ''}${m.image ? `<div style='margin-top:6px;'><img src='${m.image}' class='chat-image-view' style='max-width:180px;max-height:180px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.08);cursor:pointer;'></div>` : ''}</div><span class="message-time">${m.timestamp ? formatTimeAgo(m.timestamp) : ''}</span></div>`;

    function escapeHtml(str) {

      if (diff < day) return Math.floor(diff/hour) + 'g';

// --- WebRTC + signaling ---
let localStream = null;
let remoteStream = null;
let peerConnection = null;
let callType = null; // 'voice' | 'video'
let callRoomId = null;
let signalingRef = null;
const servers = { iceServers: [ { urls: 'stun:stun.l.google.com:19302' } ] };
const voiceCallBtn = document.getElementById('voiceCallBtn');
const videoCallBtn = document.getElementById('videoCallBtn');
const callModal = document.getElementById('callModal');
const callStatus = document.getElementById('callStatus');
const acceptCallBtn = document.getElementById('acceptCallBtn');

const endCallBtn = document.getElementById('endCallBtn');
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');

function showCallModal(type, statusText, isIncoming = false) {

if (voiceCallBtn) voiceCallBtn.onclick = () => startCall('voice');
if (videoCallBtn) videoCallBtn.onclick = () => startCall('video');
async function startCall(type) {
  if (!window.currentUser || !window.friendUid) return;
  callType = type;
  callRoomId = getConvId();
  signalingRef = getSignalingRef();
  await cleanupCall();
  showCallModal(type, 'Đang gọi...');
  // Phát âm thanh gọi đi
  try { document.getElementById('callingSound').currentTime = 0; document.getElementById('callingSound').play(); } catch(e){}
  // Lưu message bắt đầu gọi
  const convId = getConvId();
  await push(ref(database, 'messages/' + convId), {
    sender: window.currentUser.uid,
    type: 'call',
    callType: type,
    status: 'started',
    timestamp: Date.now()
  });
  localStream = await navigator.mediaDevices.getUserMedia(type === 'video' ? { video: true, audio: true } : { audio: true });
  if (type === 'video') localVideo.srcObject = localStream;
  peerConnection = createPeerConnection(type);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  await set(signalingRef, {
    type: 'offer',
    from: window.currentUser.uid,
    to: window.friendUid,
    callType: type,
    offer: offer,
    timestamp: Date.now()
  });
  listenSignaling();
  // Đếm ngược 30s nếu không có answer thì tự end và lưu missed call
  if (callTimeout) clearTimeout(callTimeout);
  callTimeout = setTimeout(async () => {
    // Nếu chưa có answer (chưa vào giao diện trò chuyện)
    if (callModal.style.display === 'flex' && callStatus.textContent === 'Đang gọi...') {
      // Lưu message missed call (role: caller)
      const convId = getConvId();
      await push(ref(database, 'messages/' + convId), {
        sender: window.currentUser.uid,
        type: 'call',
        callType: type,
        status: 'missed',
        role: 'caller',
        timestamp: Date.now()
      });
      if (signalingRef) await set(signalingRef, { type: 'end' });
      cleanupCall();
    }
  }, 30000);
}
// --- Gửi trạng thái mic/camera qua signaling ---
function sendMediaStatus() {
  if (!signalingRef || !window.currentUser || !window.friendUid) return;
  const audioTrack = localStream && localStream.getAudioTracks()[0];
  const videoTrack = localStream && localStream.getVideoTracks()[0];
  set(signalingRef, {
    type: 'media-status',
    from: window.currentUser.uid,
    to: window.friendUid,
    mic: audioTrack ? audioTrack.enabled : null,
    camera: videoTrack ? videoTrack.enabled : null,
    callType: callType,
    timestamp: Date.now()
  });
}

// --- Hiển thị thông báo trạng thái media đối phương ---
let remoteMediaStatus = { mic: true, camera: true };

  let msg = '';
  if (callType === 'video') {
    if (remoteMediaStatus.camera === false) msg += 'Đối phương đã tắt camera. ';

  if (remoteMediaStatus.mic === false) msg += 'Đối phương đã tắt mic.';
  const statusDiv = document.getElementById('callStatus');

    statusDiv.textContent = msg;
    statusDiv.style.color = '#d33';
  } else {
    statusDiv.textContent = 'Đang trò chuyện...';
    statusDiv.style.color = '';
  }
}

// --- Mini modal logic ---
const incomingCallModal = document.getElementById('incomingCallModal');
const incomingCallAvatar = document.getElementById('incomingCallAvatar');
const incomingCallName = document.getElementById('incomingCallName');
const incomingCallStatus = document.getElementById('incomingCallStatus');
const acceptIncomingCallBtn = document.getElementById('acceptIncomingCallBtn');
const rejectIncomingCallBtn = document.getElementById('rejectIncomingCallBtn');
let incomingCallData = null;

function showIncomingCallModal(data) {
  incomingCallModal.style.display = 'flex';
  incomingCallStatus.textContent = data.callType === 'video' ? 'Cuộc gọi video đến...' : 'Cuộc gọi thoại đến...';
  if (friendInfo) {
    incomingCallName.textContent = friendInfo.name || friendInfo.displayName || friendInfo.email || 'Người dùng';
    incomingCallAvatar.src = friendInfo.avatarUrl || 'images/default-avatar.png';
  } else {
    incomingCallName.textContent = 'Người dùng';

  try { document.getElementById('incomingSound').currentTime = 0; document.getElementById('incomingSound').play(); } catch(e){}
  // Đếm ngược 30s nếu không accept thì tự đóng và lưu missed call (role: callee)
  if (incomingCallTimeout) clearTimeout(incomingCallTimeout);
  incomingCallTimeout = setTimeout(async () => {
    if (incomingCallModal.style.display === 'flex') {
      // Lưu message missed call (role: callee)

        await push(ref(database, 'messages/' + convId), {
          sender: window.currentUser.uid,
          type: 'call',

        });
      }

      stopAllCallSounds();

  }, 30000);

function stopAllCallSounds() {
  try { document.getElementById('callingSound').pause(); document.getElementById('callingSound').currentTime = 0; } catch(e){}
  try { document.getElementById('incomingSound').pause(); document.getElementById('incomingSound').currentTime = 0; } catch(e){}
}
function hideIncomingCallModal() {

if (acceptIncomingCallBtn) acceptIncomingCallBtn.onclick = () => {
  console.log('[CALL] Bấm Chấp nhận, incomingCallData:', incomingCallData);
  const data = incomingCallData;

if (rejectIncomingCallBtn) rejectIncomingCallBtn.onclick = async () => {

};

function listenSignaling() {
  if (!signalingRef) signalingRef = getSignalingRef();
  off(signalingRef); // clear old
  onValue(signalingRef, async (snap) => {
    const data = snap.val();
    if (!data) return;
    if (data.type === 'offer' && data.to === window.currentUser.uid) {
      if (incomingCallModal.style.display !== 'flex' && callModal.style.display !== 'flex') {
        callType = data.callType;
        callRoomId = getConvId();
        signalingRef = getSignalingRef();
        incomingCallData = data;
        showIncomingCallModal(data);
      }
    } else if (data.type === 'answer' && data.to === window.currentUser.uid) {
      if (peerConnection && data.answer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        callStatus.textContent = 'Đang trò chuyện...';
        if (endCallBtn) endCallBtn.style.display = '';
        if (acceptCallBtn) acceptCallBtn.style.display = 'none';
        if (rejectCallBtn) rejectCallBtn.style.display = 'none';
        startCallTimer();
        stopAllCallSounds();
      }
    } else if (data.type === 'candidate' && data.to === window.currentUser.uid) {
      if (peerConnection && data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch {}
      }
    } else if (data.type === 'media-status' && data.to === window.currentUser.uid) {
      // Nhận trạng thái media đối phương
      if (typeof data.mic === 'boolean') remoteMediaStatus.mic = data.mic;
      if (typeof data.camera === 'boolean') remoteMediaStatus.camera = data.camera;
      showRemoteMediaStatus();
    } else if (data.type === 'end') {
      callStatus.textContent = 'Đã kết thúc cuộc gọi.';
      setTimeout(() => cleanupCall(), 800);
      hideIncomingCallModal();
      stopAllCallSounds();
    }
  });
}
setTimeout(() => listenSignaling(), 1000);
async function acceptCall(data) {
  console.log('[CALL] acceptCall chạy, data:', data, 'currentUser:', window.currentUser, 'friendUid:', window.friendUid);
  callType = data.callType;
  callRoomId = getConvId();
  signalingRef = getSignalingRef();
  showCallModal(callType, 'Đang kết nối...');
  try {
    localStream = await navigator.mediaDevices.getUserMedia(callType === 'video' ? { video: true, audio: true } : { audio: true });
  } catch (err) {
    console.error('[CALL] Lỗi getUserMedia:', err);
    alert('Không truy cập được camera/mic. Vui lòng kiểm tra quyền trình duyệt!');
    cleanupCall();
    return;
  }
  if (callType === 'video') localVideo.srcObject = localStream;
  peerConnection = createPeerConnection(callType);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  try {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    await set(signalingRef, {
      type: 'answer',
      from: window.currentUser.uid,
      to: window.friendUid,
      answer: answer,
      callType: callType,
      timestamp: Date.now()
    });
  } catch (err) {
    console.error('[CALL] Lỗi khi setRemoteDescription/createAnswer:', err);
    cleanupCall();
    return;
  }
  if (endCallBtn) endCallBtn.style.display = '';
  if (acceptCallBtn) acceptCallBtn.style.display = 'none';
  if (rejectCallBtn) rejectCallBtn.style.display = 'none';
  callStatus.textContent = 'Đang trò chuyện...';
  startCallTimer();
  console.log('[CALL] Đã vào giao diện gọi full màn hình!');
}
async function rejectCall() {
  // Lưu message từ chối cuộc gọi
  if (callType && window.currentUser && window.friendUid) {
    const convId = getConvId();
    await push(ref(database, 'messages/' + convId), {
      sender: window.currentUser.uid,
      type: 'call',
      callType: callType,
      status: 'rejected',
      timestamp: Date.now()
    });
  }
  if (signalingRef) await set(signalingRef, { type: 'end' });
  cleanupCall();
}
if (endCallBtn) endCallBtn.onclick = async function() {
  if (signalingRef) await set(signalingRef, { type: 'end' });
  cleanupCall();
};
function createPeerConnection(type) {
  const pc = new RTCPeerConnection(servers);
  pc.onicecandidate = (event) => {
    if (event.candidate) {
      set(signalingRef, {
        type: 'candidate',
        from: window.currentUser.uid,
        to: window.friendUid,
        candidate: event.candidate.toJSON(),
        callType: type,
        timestamp: Date.now()
      });
    }
  };
  pc.ontrack = (event) => {
    if (type === 'video') {
      remoteVideo.srcObject = event.streams[0];
      remoteVideo.style.display = 'block';
      remoteAudio.style.display = 'none';
    } else {
      remoteAudio.srcObject = event.streams[0];
      remoteAudio.style.display = 'block';
      remoteVideo.style.display = 'none';
    }
  };
  return pc;
}
async function cleanupCall() {
  // Lưu message kết thúc gọi nếu đang trong cuộc gọi
  if (callType && window.currentUser && window.friendUid && callStartTime) {
    const convId = getConvId();
    const duration = Math.floor((Date.now() - callStartTime) / 1000);
    await push(ref(database, 'messages/' + convId), {
      sender: window.currentUser.uid,
      type: 'call',
      callType: callType,
      status: 'ended',
      duration: duration,
      timestamp: Date.now()
    });
  }
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }
  if (remoteStream) {
    remoteStream = null;
  }
  hideCallModal();
  if (signalingRef) await remove(signalingRef);
}
callModal.onclick = function(e) {
  if (e.target === callModal) cleanupCall();
};

  };
}
// --- Call Timer ---
let callTimerInterval = null;
let callStartTime = null;
function startCallTimer() {
  callStartTime = Date.now();
  const callTimer = document.getElementById('callTimer');
  if (callTimerInterval) clearInterval(callTimerInterval);
  callTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const sec = (elapsed % 60).toString().padStart(2, '0');
    callTimer.textContent = `${min}:${sec}`;
  }, 1000);
  callTimer.textContent = '00:00';
}
function stopCallTimer() {
  if (callTimerInterval) clearInterval(callTimerInterval);
  callTimerInterval = null;
  callStartTime = null;
  const callTimer = document.getElementById('callTimer');
  if (callTimer) callTimer.textContent = '00:00';
    }
